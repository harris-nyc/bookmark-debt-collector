[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-debt-collector"
version = "0.1.0"
description = "Turn your X bookmarks into a to-do list, check what's still alive, and get a shareable Bookmark Wrapped card."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "requests>=2.31"]

[project.optional-dependencies]
# PNG rendering. Not needed if Chrome/Chromium is already installed (bdc drives it directly).
png = ["playwright>=1.40"]
# better theme clusters (local CPU embeddings, ~130 MB model download on first run). Falls back to TF-IDF without it.
embeddings = ["fastembed>=0.3"]

[project.scripts]
bdc = "bdc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
